name: iOS OTA Runtime

on:
  push:
    branches: [main]
    paths:
      - "apps/ios-runtime/src/**"
      - "apps/ios-runtime/index.ts"
      - "apps/ios-runtime/babel.config.js"
      - "apps/ios-runtime/metro.config.js"
  workflow_dispatch:
    inputs:
      mode:
        description: 发布模式 / Mode；normal 更新，recovery 回退
        required: true
        default: normal
        type: choice
        options:
          - normal
          - recovery
      channel:
        description: 发布通道 / EAS Update channel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
      source_ref:
        description: 可用标签或提交 / Known-good ref（recovery）
        required: false
        default: v0.5.9
        type: string
      runtime_version:
        description: 目标运行时 / Target runtime（recovery）
        required: false
        default: 0.6.0
        type: string

permissions:
  contents: read

concurrency:
  group: tempo-ios-ota-${{ github.ref }}-${{ inputs.mode || 'normal' }}-${{ inputs.runtime_version || 'current' }}
  cancel-in-progress: ${{ inputs.mode != 'recovery' }}

jobs:
  validate-runtime:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'normal'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ios-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ios-runtime/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Guard automatic update lifecycle
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'Updates\.(reloadAsync|checkForUpdateAsync|fetchUpdateAsync)' src; then
            echo 'Do not reload Expo Updates from React roots. The native ON_LOAD lifecycle owns automatic OTA adoption.' >&2
            exit 1
          fi
      - name: Resolve native runtime version
        shell: bash
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' ../flutter/pubspec.yaml)"
          test -n "$version"
          echo "TEMPO_APP_VERSION=$version" >> "$GITHUB_ENV"
      - run: npm run export:ios

  publish-update:
    if: github.event_name != 'workflow_dispatch' || inputs.mode == 'normal'
    needs: validate-runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ios-runtime
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ios-runtime/package-lock.json
      - run: npm ci
      - name: Resolve native runtime version
        shell: bash
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' ../flutter/pubspec.yaml)"
          test -n "$version"
          echo "TEMPO_APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish EAS Update
        if: env.EXPO_TOKEN != ''
        shell: bash
        run: |
          channel="${{ github.event.inputs.channel }}"
          if [[ -z "$channel" ]]; then channel="production"; fi
          npx --yes eas-cli@latest update \
            --channel "$channel" \
            --platform ios \
            --message "${GITHUB_SHA::12}" \
            --non-interactive
      - name: Explain unpublished validation
        if: env.EXPO_TOKEN == ''
        run: echo "OTA export validated. Add EXPO_TOKEN to publish updates."

  publish-known-good-update:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'recovery'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ios-runtime
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      RUNTIME_VERSION: ${{ inputs.runtime_version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ios-runtime/package-lock.json
      - name: Validate recovery target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNTIME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$EXPO_TOKEN"
          printf '%s\n' "$RUNTIME_VERSION" > runtime-version.txt
          echo "TEMPO_APP_VERSION=$RUNTIME_VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run export:ios
      - name: Publish known-good update
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest update \
            --channel "$CHANNEL" \
            --platform ios \
            --message "recovery-${{ inputs.source_ref }}-for-runtime-${RUNTIME_VERSION}" \
            --non-interactive
