name: iOS OTA Runtime

on:
  push:
    branches: [main]
    paths:
      - "apps/ios-runtime/src/**"
      - "apps/ios-runtime/index.ts"
      - "apps/ios-runtime/babel.config.js"
      - "apps/ios-runtime/metro.config.js"
  workflow_dispatch:
    inputs:
      channel:
        description: EAS Update channel
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: tempo-ios-ota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ios-runtime
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ios-runtime/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Guard automatic update lifecycle
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -E 'Updates\.(reloadAsync|checkForUpdateAsync|fetchUpdateAsync)' src; then
            echo 'Do not reload Expo Updates from React roots. The native ON_LOAD lifecycle owns automatic OTA adoption.' >&2
            exit 1
          fi
      - name: Resolve native runtime version
        shell: bash
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' ../flutter/pubspec.yaml)"
          test -n "$version"
          echo "TEMPO_APP_VERSION=$version" >> "$GITHUB_ENV"
      - run: npm run export:ios

  publish-update:
    needs: validate-runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ios-runtime
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ios-runtime/package-lock.json
      - run: npm ci
      - name: Resolve native runtime version
        shell: bash
        run: |
          version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' ../flutter/pubspec.yaml)"
          test -n "$version"
          echo "TEMPO_APP_VERSION=$version" >> "$GITHUB_ENV"
      - name: Publish EAS Update
        if: env.EXPO_TOKEN != ''
        shell: bash
        run: |
          channel="${{ github.event.inputs.channel }}"
          if [[ -z "$channel" ]]; then channel="production"; fi
          npx --yes eas-cli@latest update \
            --channel "$channel" \
            --platform ios \
            --message "${GITHUB_SHA::12}" \
            --non-interactive
      - name: Explain unpublished validation
        if: env.EXPO_TOKEN == ''
        run: echo "OTA export validated. Add EXPO_TOKEN to publish updates."
