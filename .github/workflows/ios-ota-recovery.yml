name: iOS OTA Recovery

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Known-good source tag or commit
        required: true
        default: v0.5.9
        type: string
      runtime_version:
        description: Broken runtime to recover
        required: true
        default: 0.6.0
        type: string
      channel:
        description: EAS Update channel
        required: true
        default: production
        type: choice
        options:
          - production
          - preview

permissions:
  contents: read

concurrency:
  group: tempo-ios-ota-recovery-${{ inputs.runtime_version }}-${{ inputs.channel }}
  cancel-in-progress: false

jobs:
  publish-known-good-update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ios-runtime
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      RUNTIME_VERSION: ${{ inputs.runtime_version }}
      CHANNEL: ${{ inputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ios-runtime/package-lock.json
      - name: Validate recovery target
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RUNTIME_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test -n "$EXPO_TOKEN"
          printf '%s\n' "$RUNTIME_VERSION" > runtime-version.txt
          echo "TEMPO_APP_VERSION=$RUNTIME_VERSION" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run export:ios
      - name: Publish known-good production update
        shell: bash
        run: |
          set -euo pipefail
          npx --yes eas-cli@latest update \
            --channel "$CHANNEL" \
            --platform ios \
            --message "recovery-${{ inputs.source_ref }}-for-runtime-${RUNTIME_VERSION}" \
            --non-interactive
