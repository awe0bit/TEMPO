name: iOS Native Release

on:
  push:
    branches: [main]
    paths:
      - "apps/apple/iOS/**"
      - "apps/apple/Configuration/TempoiOS.entitlements"
      - "apps/apple/Configuration/TempoWidgets.entitlements"
      - "apps/ios-runtime/package.json"
      - "apps/ios-runtime/package-lock.json"
      - "apps/ios-runtime/app.config.js"
      - "apps/ios-runtime/scripts/**"
      - ".github/workflows/ios-native-release.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: tempo-ios-native-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-ios:
    runs-on: macos-26
    outputs:
      product_version: ${{ steps.version.outputs.product_version }}
      platform_revision: ${{ steps.version.outputs.platform_revision }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      asset_name: ${{ steps.version.outputs.asset_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve product version and iOS revision
        id: version
        shell: bash
        run: |
          set -euo pipefail
          product_version="$(sed -nE 's/^version:[[:space:]]*([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' apps/flutter/pubspec.yaml)"
          source_build="$(sed -nE 's/^[[:space:]]*CURRENT_PROJECT_VERSION:[[:space:]]*"?([0-9]+)"?.*/\1/p' apps/apple/project.yml | head -n 1)"
          test -n "$product_version"
          test -n "$source_build"

          latest_tag="$(git tag --list "v${product_version}-ios.*" --sort=-v:refname | head -n 1)"
          if [[ -n "$latest_tag" ]]; then
            previous_revision="${latest_tag##*.}"
            [[ "$previous_revision" =~ ^[0-9]+$ ]]
            platform_revision=$((previous_revision + 1))
          else
            platform_revision=1
          fi

          build_number=$((source_build + platform_revision))
          release_tag="v${product_version}-ios.${platform_revision}"
          asset_name="TEMPO-${product_version}-iOS-r${platform_revision}-unsigned.ipa"
          {
            echo "product_version=$product_version"
            echo "platform_revision=$platform_revision"
            echo "build_number=$build_number"
            echo "release_tag=$release_tag"
            echo "asset_name=$asset_name"
          } >> "$GITHUB_OUTPUT"
          echo "Building $release_tag (CFBundleVersion $build_number)"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/ios-runtime/package-lock.json

      - name: Build embedded React Native runtime
        working-directory: apps/ios-runtime
        env:
          CI: "1"
          TEMPO_APP_VERSION: ${{ steps.version.outputs.product_version }}
        run: |
          npm ci
          npm run prebuild:ios
          npm run build:brownfield:ios
          test -f artifacts/TempoRuntimePackage-release/Package.swift

      - name: Generate native Apple project
        working-directory: apps/apple
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build unsigned iOS app only
        working-directory: apps/apple
        env:
          APP_VERSION: ${{ steps.version.outputs.product_version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project TempoApple.xcodeproj \
            -scheme TempoiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            MARKETING_VERSION="$APP_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      - name: Package unsigned IPA
        working-directory: apps/apple
        env:
          ASSET_NAME: ${{ steps.version.outputs.asset_name }}
        run: |
          set -euo pipefail
          app_path="build/DerivedData/Build/Products/Release-iphoneos/TEMPO.app"
          test -d "$app_path/PlugIns/TEMPOWidgets.appex"
          mkdir -p build/ipa/Payload
          cp -R "$app_path" build/ipa/Payload/TEMPO.app
          (cd build/ipa && zip -r "../../$ASSET_NAME" Payload)

      - name: Attest iOS package
        uses: actions/attest@v4
        with:
          subject-path: apps/apple/${{ steps.version.outputs.asset_name }}

      - name: Publish platform release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.release_tag }}
          PRODUCT_VERSION: ${{ steps.version.outputs.product_version }}
          PLATFORM_REVISION: ${{ steps.version.outputs.platform_revision }}
          ASSET_NAME: ${{ steps.version.outputs.asset_name }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "TEMPO ${PRODUCT_VERSION} · iOS r${PLATFORM_REVISION}" \
              --notes "iOS 原生修订版。产品版本保持 ${PRODUCT_VERSION}；仅 iOS 安装包更新。"
          fi
          gh release upload "$RELEASE_TAG" "apps/apple/$ASSET_NAME" --clobber
