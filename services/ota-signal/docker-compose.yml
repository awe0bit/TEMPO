services:
  ota-signal:
    build: .
    image: tempo-ota-signal:local
    restart: unless-stopped
    environment:
      OTA_SIGNAL_TOKEN: ${OTA_SIGNAL_TOKEN:?OTA_SIGNAL_TOKEN is required}
      OTA_SIGNAL_ADDR: :8787
    ports:
      - "127.0.0.1:8787:8787"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 32m
    healthcheck:
      test: ["CMD", "/tempo-ota-signal", "healthcheck"]
      interval: 30s
      timeout: 3s
      retries: 3
