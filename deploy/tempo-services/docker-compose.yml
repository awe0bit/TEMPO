name: tempo-services

services:
  sync:
    build:
      context: ./sync
    image: tempo-sync:local
    restart: unless-stopped
    env_file:
      - sync.env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /opt/qingxu/sync/data:/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "/tempo-sync", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    stop_grace_period: 15s
